name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, store, pos]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # Must match `packageManager` in the root package.json. The root
          # lockfile is pnpm-10 format; installing with pnpm 9 fails
          # `--frozen-lockfile`.
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Installed once from the root so the whole workspace resolves against the
      # single root lockfile, then each app is checked, tested and built.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dashpoint/${{ matrix.app }} check
        # `--if-present` because apps/web is a static landing page with no
        # tests; every other app must define the script.
      - run: pnpm --filter @dashpoint/${{ matrix.app }} run --if-present test
      - run: pnpm --filter @dashpoint/${{ matrix.app }} build
