<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="DashPoint">
    <!--
    DashPoint mark: a point-of-sale terminal (card reader) showing a payment
    being tapped, over the DashPoint blue. Self-contained (no external fonts or
    images), so it renders identically as a favicon and inline as the hero logo.
    -->
    <defs>
        <linearGradient id="dp-badge" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3B82F6"/>
            <stop offset="1" stop-color="#1D4ED8"/>
        </linearGradient>
    </defs>

    <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#dp-badge)"/>

    <!-- Terminal body: rounded screen up top, wider base below -->
    <rect x="42" y="30" width="44" height="58" rx="7" fill="#FFFFFF"/>
    <rect x="34" y="86" width="60" height="14" rx="6" fill="#FFFFFF"/>

    <!-- Screen: a payment card being tapped -->
    <rect x="50" y="40" width="28" height="18" rx="4" fill="#2E6BE9"/>
    <rect x="56" y="49" width="16" height="9" rx="2" fill="#FFFFFF"/>

    <!-- Keypad dots -->
    <circle cx="52" cy="68" r="3" fill="#9DBBF5"/>
    <circle cx="64" cy="68" r="3" fill="#9DBBF5"/>
    <circle cx="76" cy="68" r="3" fill="#9DBBF5"/>
    <circle cx="52" cy="78" r="3" fill="#9DBBF5"/>
    <circle cx="64" cy="78" r="3" fill="#9DBBF5"/>
    <circle cx="76" cy="78" r="3" fill="#9DBBF5"/>

    <!-- Contactless "tap to pay" arcs above the reader -->
    <path d="M92 34a18 18 0 0 1 0 26" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M100 27a28 28 0 0 1 0 40" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="5" stroke-linecap="round" fill="none"/>
</svg>
