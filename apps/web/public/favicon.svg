<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="DashPoint">
    <!--
    DashPoint mark: a rounded-square badge holding a "D" whose counter is a
    downward payment arrow, over the DashPoint blue. Self-contained (no external
    fonts or images), so it renders identically as a favicon and inline as the
    landing-page logo.
    -->
    <defs>
        <linearGradient id="dp-badge" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3B82F6"/>
            <stop offset="1" stop-color="#1D4ED8"/>
        </linearGradient>
    </defs>

    <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#dp-badge)"/>

    <!-- The "D": stem plus bowl -->
    <path d="M44 34h22c18 0 30 12 30 30s-12 30-30 30H44V34Zm18 48c9 0 15-6 15-18s-6-18-15-18h-4v36h4Z"
          fill="#FFFFFF"/>

    <!-- Payment arrow dropping through the counter -->
    <path d="M36 92h56" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round"/>
    <path d="M64 78v22m0 0-9-9m9 9 9-9" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
